plugins {
    alias(libs.plugins.android.application)
}

import java.util.Properties

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// 统一的后端地址配置：
// - primary 默认走 100.124.104.65（可在 local.properties 覆盖）
// - debug fallback 默认走本地后端（Android 模拟器访问宿主机请使用 10.0.2.2）
// - release fallback 默认走现有远端地址
// - 可在 local.properties 中覆盖（不会被提交）：
//   backend.baseUrl.primary=http://100.124.104.65:5000/
//   backend.baseUrl.debug=http://10.0.2.2:5000/
//   backend.baseUrl.release=https://your-prod-host/
//   debug.keystore.path=.data/android/debug.keystore
def backendUrlPrimaryDefault = "http://100.124.104.65:5000/"
def backendUrlRemoteDefault = "https://rocky-phantasmagorical-oafishly.ngrok-free.dev/"
def backendUrlDebugDefault = "http://10.0.2.2:5000/"

def backendUrlPrimary = localProps.getProperty("backend.baseUrl.primary", backendUrlPrimaryDefault)
def backendUrlDebug = localProps.getProperty("backend.baseUrl.debug", backendUrlDebugDefault)
def backendUrlRelease = localProps.getProperty("backend.baseUrl.release", backendUrlRemoteDefault)
def debugKeystorePath = localProps.getProperty("debug.keystore.path", ".data/android/debug.keystore")
def debugKeystoreFile = rootProject.file(debugKeystorePath)

android {
    namespace = "com.example.healthassistant"
    compileSdk 36 // 提升到 36 以满足依赖要求

    defaultConfig {
        applicationId "com.example.healthassistant"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            // 使用项目内的debug keystore，避免依赖~/.android/debug.keystore
            storeFile debugKeystoreFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            buildConfigField "String", "BACKEND_BASE_URL", "\"${backendUrlPrimary}\""
            buildConfigField "String", "FALLBACK_BACKEND_BASE_URL", "\"${backendUrlDebug}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BACKEND_BASE_URL", "\"${backendUrlPrimary}\""
            buildConfigField "String", "FALLBACK_BACKEND_BASE_URL", "\"${backendUrlRelease}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion '36.0.0' // 同步更新 Build Tools Version
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- AI Health Butler 核心依赖 ---

    // 1. Retrofit & Gson for Networking (与Python后端通信)
    def retrofit_version = "2.9.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation 'com.google.code.gson:gson:2.10.1'

    // 2. Room Database for local storage (药品计划)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    // Room 编译时处理器 - 必须
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // 3. Glide for Image Loading (显示拍摄的照片)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Glide 编译时处理器 - 必须
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}

def releaseOutputMetadata = layout.buildDirectory.file("outputs/apk/release/output-metadata.json")
tasks.matching { it.name == "packageRelease" }.configureEach {
    outputs.file(releaseOutputMetadata)
}
tasks.matching { it.name == "createReleaseApkListingFileRedirect" }.configureEach {
    dependsOn("packageRelease")
}
